<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Q.E.D. — Сначала доказательства</title>
  <desc id="desc">Инженерный стандарт и механические проверки для разработки с ИИ.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0b0f17" /><stop offset="1" stop-color="#111827" /></linearGradient>
  </defs>
  <rect x="2" y="2" width="956" height="146" rx="14" fill="url(#canvas)" stroke="#334155" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="34" fill="#94a3b8" font-size="11" letter-spacing="2">ИНЖЕНЕРИЯ / ПРОВЕРЕНО</text>
    <text x="28" y="98" fill="#f8fafc" font-size="57" font-weight="750" letter-spacing="-2">Q.E.D.</text>
    <path d="M244 50v54" stroke="#334155" />
    <text x="270" y="72" fill="#f8fafc" font-size="23" font-weight="600">Сначала доказательства.</text>
    <text x="270" y="100" fill="#94a3b8" font-size="15">Правила для агентов. Проверки для инженеров.</text>
    <text x="30" y="130" fill="#94a3b8" font-size="11">QUOD ERAT DEMONSTRANDUM</text>
    <rect x="856" y="44" width="58" height="58" rx="3" fill="none" stroke="#10b981" stroke-width="2" />
    <rect x="868" y="56" width="34" height="34" rx="1" fill="#10b981" />
    <text x="885" y="125" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="1">ФАКТЫ, НЕ ОБЕЩАНИЯ</text>
  </g>
</svg>