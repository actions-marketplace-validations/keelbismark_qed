<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="qedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Card Container: Fully Theme-Immune (Dark Canvas Card) -->
  <rect x="2" y="2" width="916" height="176" rx="16" fill="url(#bannerBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Precision Blueprint Technical Grid Accent (Right Side) -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="680" y1="20" x2="890" y2="20"/>
    <line x1="680" y1="50" x2="890" y2="50"/>
    <line x1="680" y1="80" x2="890" y2="80"/>
    <line x1="680" y1="110" x2="890" y2="110"/>
    <line x1="680" y1="140" x2="890" y2="140"/>
    <line x1="720" y1="10" x2="720" y2="170"/>
    <line x1="760" y1="10" x2="760" y2="170"/>
    <line x1="800" y1="10" x2="800" y2="170"/>
    <line x1="840" y1="10" x2="840" y2="170"/>
    <line x1="880" y1="10" x2="880" y2="170"/>
    <!-- Subtle circular radar rings -->
    <circle cx="820" cy="90" r="50" fill="none"/>
    <circle cx="820" cy="90" r="25" fill="none"/>
  </g>

  <!-- Logo Mark: Mathematical Proof Shield & Stylized Q -->
  <g transform="translate(44, 40)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <!-- Inner Accent Rim -->
    <rect x="4" y="4" width="92" height="92" rx="12" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <!-- The Proof Q Circle -->
    <circle cx="50" cy="46" r="25" fill="none" stroke="#60a5fa" stroke-width="5.5"/>
    <!-- The Proof Q Leg / Vector Pointer -->
    <line x1="64" y1="60" x2="80" y2="76" stroke="#10b981" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Inner Proof Center Dot -->
    <circle cx="50" cy="46" r="7" fill="#38bdf8"/>
  </g>

  <!-- Tagline Pill Badge -->
  <g transform="translate(168, 36)">
    <rect x="0" y="0" width="236" height="24" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">EVIDENCE BEFORE ASSERTIONS</text>
  </g>

  <!-- Version / Maturity Pill Badge -->
  <g transform="translate(414, 36)">
    <rect x="0" y="0" width="112" height="24" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
    <text x="56" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">v1.0 STANDARD</text>
  </g>

  <!-- Main Title: Q.E.D. + Latin Motto -->
  <g transform="translate(168, 96)">
    <text x="0" y="0" fill="url(#qedGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Q.E.D.</text>
    <text x="160" y="-4" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" font-style="italic">Quod Erat Demonstrandum</text>
  </g>

  <!-- Description Subtitle -->
  <g transform="translate(168, 130)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">The High-Assurance Engineering Standard &amp; Harness Platform for Autonomous Coding Agents</text>
  </g>
</svg>
