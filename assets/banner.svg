<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="176" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Geometric Watermark / Grid -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="1">
    <line x1="680" y1="20" x2="860" y2="20"/>
    <line x1="680" y1="50" x2="860" y2="50"/>
    <line x1="680" y1="80" x2="860" y2="80"/>
    <line x1="680" y1="110" x2="860" y2="110"/>
    <line x1="680" y1="140" x2="860" y2="140"/>
    <line x1="720" y1="10" x2="720" y2="170"/>
    <line x1="760" y1="10" x2="760" y2="170"/>
    <line x1="800" y1="10" x2="800" y2="170"/>
    <line x1="840" y1="10" x2="840" y2="170"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(48, 42)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Stylized Q with proof tick -->
    <circle cx="48" cy="44" r="24" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <line x1="62" y1="58" x2="76" y2="72" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <circle cx="48" cy="44" r="8" fill="#3b82f6" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <!-- Tag Pill -->
  <rect x="172" y="38" width="224" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="184" cy="50" r="4" fill="#38bdf8"/>
  <text x="196" y="54" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EVIDENCE BEFORE ASSERTIONS</text>

  <!-- Main Title -->
  <text x="172" y="98" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Q.E.D.</text>
  <text x="324" y="95" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" font-style="italic">Quod Erat Demonstrandum</text>

  <!-- Subtitle -->
  <text x="172" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">The High-Assurance Engineering Standard for Autonomous Coding Agents</text>
</svg>