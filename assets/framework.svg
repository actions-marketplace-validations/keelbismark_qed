<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 144" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Three complementary layers</title>
  <desc id="desc">The standard defines engineering practices. Adapters deliver instructions to agents. The CLI detects selected anti-patterns; tests and review remain necessary.</desc>
  <defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect x="2" y="2" width="956" height="140" rx="14" fill="url(#canvas)" stroke="#334155"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <path d="M320 25v94M640 25v94" stroke="#334155"/>
    <g font-size="10" letter-spacing="2" fill="#60a5fa"><text x="28" y="33">DEFINE</text><text x="348" y="33">DELIVER</text><text x="668" y="33" fill="#34d399">DETECT</text></g>
    <g font-size="23" fill="#f8fafc" font-weight="600"><text x="28" y="69">Engineering standard</text><text x="348" y="69">Agent adapters</text><text x="668" y="69">Verification CLI</text></g>
    <g font-size="13" fill="#94a3b8"><text x="28" y="99">Practices, boundaries, judgment.</text><text x="348" y="99">Native rules. Full or Lite.</text><text x="668" y="99">Selected patterns. Local evidence.</text></g>
    <g font-size="10" fill="#94a3b8" letter-spacing="1"><text x="28" y="124">core/</text><text x="348" y="124">adapters/</text><text x="668" y="124">qed check</text></g>
  </g>
</svg>
