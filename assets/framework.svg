<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="frameworkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="tierCard1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="tierCard2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162e2d"/>
      <stop offset="100%" stop-color="#0c1a19"/>
    </linearGradient>

    <linearGradient id="tierCard3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241b38"/>
      <stop offset="100%" stop-color="#110d1c"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="subtleBoxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Protective Theme-Immune Container -->
  <rect x="2" y="2" width="916" height="166" rx="14" fill="url(#frameworkBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Column 1: Universal Foundation & Resource Invariants -->
  <g transform="translate(14, 14)" filter="url(#subtleBoxShadow)">
    <rect x="0" y="0" width="246" height="142" rx="10" fill="url(#tierCard1)" stroke="#334155" stroke-width="1.2"/>
    <!-- Header -->
    <rect x="12" y="10" width="22" height="18" rx="4" fill="#3b82f6" opacity="0.25"/>
    <text x="23" y="23" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">A</text>
    <text x="40" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Universal Invariants</text>
    <!-- Bullets -->
    <circle cx="20" cy="48" r="2.5" fill="#3b82f6"/>
    <text x="28" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Pristine Root &amp; Zero-Debug Gate</text>
    <circle cx="20" cy="68" r="2.5" fill="#3b82f6"/>
    <text x="28" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">UTF-8 &amp; UTC Wire Serialization</text>
    <circle cx="20" cy="88" r="2.5" fill="#3b82f6"/>
    <text x="28" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Bounded LRU Caches &amp; Streams</text>
    <circle cx="20" cy="108" r="2.5" fill="#3b82f6"/>
    <text x="28" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Build vs. Buy &amp; Wrapper Invariant</text>
    <circle cx="20" cy="128" r="2.5" fill="#3b82f6"/>
    <text x="28" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Zero Secret Leaks in Git History</text>
  </g>

  <!-- Flow Connector A -> B -->
  <g transform="translate(262, 78)">
    <line x1="2" y1="8" x2="16" y2="8" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="16,4 24,8 16,12" fill="#3b82f6"/>
  </g>

  <!-- Column 2: 4-Phase Verification Engine -->
  <g transform="translate(290, 14)" filter="url(#subtleBoxShadow)">
    <rect x="0" y="0" width="340" height="142" rx="10" fill="url(#tierCard2)" stroke="#10b981" stroke-width="1.3"/>
    <!-- Header -->
    <rect x="12" y="10" width="22" height="18" rx="4" fill="#10b981" opacity="0.3"/>
    <text x="23" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">B</text>
    <text x="40" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4-Phase Verification Engine</text>
    
    <!-- Mini Stage 1 & 2 -->
    <rect x="12" y="38" width="150" height="44" rx="6" fill="#0c201e" stroke="#134e4a" stroke-width="1"/>
    <text x="20" y="54" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PHASE 1: SPEC &amp; RADIUS</text>
    <text x="20" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Search Before Create • Blast</text>

    <rect x="176" y="38" width="152" height="44" rx="6" fill="#0c201e" stroke="#134e4a" stroke-width="1"/>
    <text x="184" y="54" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PHASE 2: ADVERSARIAL QA</text>
    <text x="184" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">4 States • Chaos Monkey</text>

    <!-- Mini Stage 3 & 4 -->
    <rect x="12" y="88" width="150" height="44" rx="6" fill="#0c201e" stroke="#134e4a" stroke-width="1"/>
    <text x="20" y="104" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PHASE 3: IRONCLAD TDD</text>
    <text x="20" y="120" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Reproduction (RED → GREEN)</text>

    <rect x="176" y="88" width="152" height="44" rx="6" fill="#0c201e" stroke="#134e4a" stroke-width="1"/>
    <text x="184" y="104" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PHASE 4: VERIFICATION GATE</text>
    <text x="184" y="120" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">3 AM Readability • Tests 100%</text>
  </g>

  <!-- Flow Connector B -> C -->
  <g transform="translate(632, 78)">
    <line x1="2" y1="8" x2="16" y2="8" stroke="#10b981" stroke-width="2"/>
    <polygon points="16,4 24,8 16,12" fill="#10b981"/>
  </g>

  <!-- Column 3: Trust Contract & Multi-Harness Ecosystem -->
  <g transform="translate(660, 14)" filter="url(#subtleBoxShadow)">
    <rect x="0" y="0" width="246" height="142" rx="10" fill="url(#tierCard3)" stroke="#8b5cf6" stroke-width="1.2"/>
    <!-- Header -->
    <rect x="12" y="10" width="22" height="18" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="23" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">C</text>
    <text x="40" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Trust Contract &amp; Platforms</text>
    <!-- Bullets -->
    <circle cx="20" cy="48" r="2.5" fill="#a855f7"/>
    <text x="28" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Threat-Adaptive Security (4 Tiers)</text>
    <circle cx="20" cy="68" r="2.5" fill="#a855f7"/>
    <text x="28" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Anti-Security-Theater (NIST 800)</text>
    <circle cx="20" cy="88" r="2.5" fill="#a855f7"/>
    <text x="28" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Earned Regionality (Levels 0–3)</text>
    <circle cx="20" cy="108" r="2.5" fill="#a855f7"/>
    <text x="28" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Bisect Invariant &amp; Changelogs</text>
    <circle cx="20" cy="128" r="2.5" fill="#a855f7"/>
    <text x="28" y="132" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">✓ 20 Platforms Native Parity</text>
  </g>
</svg>
