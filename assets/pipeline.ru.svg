    <g font-size="19" font-weight="600" fill="#f8fafc"><text x="25" y="83">Границы</text><text x="263" y="83">Допущения</text><text x="501" y="83">Воспроизвести</text><text x="739" y="83">Подтвердить</text></g>
    <g font-size="13" fill="#94a3b8"><text x="25" y="110">Поиск. Анализ влияния.</text><text x="263" y="110">Состояния. Ввод. Гонки.</text><text x="501" y="110">Падающий тест → правка.</text><text x="739" y="110">Проверки. Факты.</text></g>
