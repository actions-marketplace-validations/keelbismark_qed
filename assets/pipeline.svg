<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="120">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Stage 1 -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="26" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">01</text>
    <text x="48" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Scope &amp; Impact</text>
    <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Anti-Duplication Grep</text>
    <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Blast Radius Mapping</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Binary Pass/Fail Criteria</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(205, 52)">
    <line x1="0" y1="8" x2="16" y2="8" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="16,4 24,8 16,12" fill="#60a5fa"/>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(233, 10)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="20" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <text x="26" y="26" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">02</text>
    <text x="48" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Adversarial QA</text>
    <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• 4 Mandatory States</text>
    <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Chaos Monkey Testing</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Concurrency &amp; Payloads</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(428, 52)">
    <line x1="0" y1="8" x2="16" y2="8" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="16,4 24,8 16,12" fill="#8b5cf6"/>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(456, 10)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="20" rx="4" fill="#ec4899" opacity="0.2"/>
    <text x="26" y="26" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">03</text>
    <text x="48" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Ironclad TDD</text>
    <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Failing Test First (RED)</text>
    <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Minimal Fix (GREEN)</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• The 3 AM Test Polish</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(651, 52)">
    <line x1="0" y1="8" x2="16" y2="8" stroke="#10b981" stroke-width="2"/>
    <polygon points="16,4 24,8 16,12" fill="#10b981"/>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(679, 10)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="url(#activeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="26" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">04</text>
    <text x="48" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Verification Gate</text>
    <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Typecheck &amp; Linter</text>
    <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Full Regression Suite</text>
    <text x="14" y="88" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✓ Atomic Commit</text>
  </g>
</svg>
